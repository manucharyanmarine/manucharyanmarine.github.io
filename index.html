<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HarMar Games</title>
<style>
  :root { color-scheme: light dark; --bg: #15182f; --fg: #f4f1e8; --muted: #b8bde0; --accent: #f5c24a; --card: #1f2346; }
  body { margin: 0; background: linear-gradient(#141833, #2a2550); min-height: 100vh; color: var(--fg);
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px; }
  h1 { color: var(--accent); margin: 0 0 4px; font-size: 40px; }
  .card { background: var(--card); border-radius: 20px; padding: 20px; margin-top: 28px; display: flex; gap: 20px; align-items: center; }
  .card img { width: 96px; height: 96px; border-radius: 22px; flex: none; }
  .muted { color: var(--muted); } a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>HarMar Games</h1>
  <p class="muted">Calm, cozy puzzle games.</p>
  <div class="card">
    <img src="lampbloom-icon.png" alt="LampBloom icon">
    <div>
      <strong>LampBloom</strong><br>
      <span class="muted">Light every lamp in one colour — a gentle night-garden puzzle.</span><br>
      <a href="privacy.html">Privacy policy</a>
    </div>
  </div>
  <p class="muted" style="margin-top:32px">Contact: <a href="mailto:harmargames@gmail.com">harmargames@gmail.com</a></p>
</main>
</body>
</html>
